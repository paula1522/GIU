<div class="radio-container">

    <input
      type="radio"
      [id]="id"
      [name]="name"
      [value]="value"
      [checked]="isChecked"
      [disabled]="disabled"
      (change)="onChange()"
    />
  
    @if (textLabel) {
      <label
        class="form-label"
        [attr.for]="id">
        {{ textLabel }}
      </label>
    }
  
  </div>
