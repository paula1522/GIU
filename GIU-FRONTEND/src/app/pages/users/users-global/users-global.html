<div class="page">
  <h1 class="page-title">Usuarios del Sistema</h1>
  <p class="page-subtitle">Listado general de todos los usuarios registrados y sus aplicaciones asociadas</p>

  <div class="filters-bar">
    <input type="text" class="input" placeholder="Buscar por usuario, nombre o correo…" [ngModel]="searchTerm()" (ngModelChange)="searchTerm.set($event); filtrar()" />
  </div>

  @if (loading()) {
    <div class="loading">Cargando…</div>
  } @else {
    <app-table
      [tableTitle]="'Usuarios del sistema'"
      [tableColumnTitle]="tableColumnTitle"
      [columnsToDisplay]="columnsToDisplay"
      [dataSource]="tableData()"
      [showPaginator]="true"
      [totalItemsPerPag]="10"
      [idTable]="'users-global'"
    ></app-table>
  }
</div>
