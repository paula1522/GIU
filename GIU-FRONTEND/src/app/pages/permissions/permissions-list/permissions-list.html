<app-header-pages
  [title]="'Permisos / Recursos'"
  [subtitle]="'Listado de todos los permisos que pueden ser asignados a un rol para la aplicación seleccionada'"
></app-header-pages>


<div class="page">
  <div class="filters-bar">
    <input type="text" class="input" placeholder="Buscar…" [ngModel]="searchTerm()" (ngModelChange)="searchTerm.set($event); filtrar()" />
  </div>
  @if (loading()) { <div class="loading">Cargando…</div> }
  @else {
    <app-table
      [tableTitle]="'Permisos / Recursos'"
      [tableColumnTitle]="tableColumnTitle"
      [columnsToDisplay]="columnsToDisplay"
      [dataSource]="tableData()"
      [showPaginator]="true"
      [totalItemsPerPag]="10"
      [idTable]="'permissions-list'"
    ></app-table>
  }
</div>
