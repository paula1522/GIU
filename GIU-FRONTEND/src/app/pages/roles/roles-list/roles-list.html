<app-header-pages
  [title]="'Roles'"
  [subtitle]="'Roles creados parala aplicación seleccionada'"
  [buttons]="headerButtons()"
  (buttonClick)="abrirCrear()"
></app-header-pages>



<div class="page">

  <div class="filters-bar">
    <input type="text" class="input" placeholder="Buscar rol…" [ngModel]="searchTerm()" (ngModelChange)="searchTerm.set($event); filtrar()" />
  </div>

  @if (loading()) { <div class="loading">Cargando…</div> }
  @else {
    <app-table
      [tableTitle]="'Roles'"
      [tableColumnTitle]="tableColumnTitle"
      [columnsToDisplay]="columnsToDisplay"
      [dataSource]="tableData()"
      [showPaginator]="true"
      [totalItemsPerPag]="10"
      [idTable]="'roles-list'"
      (clickEventButton)="onTableAction($event)"
    ></app-table>
  }
</div>

@if (showForm()) {
  <div class="overlay" (click)="cerrarForm()">
    <div class="modal" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2>{{ editingRole() ? 'Editar rol' : 'Nuevo rol' }}</h2>
        <app-button
          [icon]="'bi bi-x-lg'"
          [class]="['btn', 'btn-primary-secondary']"
          [type]="'button'"
          (clickEventButton)="cerrarForm()"
        ></app-button>
      </div>
      <div class="modal-body">
        <form [formGroup]="roleForm" (ngSubmit)="guardar()">
          <app-input
            [textLabel]="'Nombre'"
            [form]="roleForm"
            [controlName]="'nombre'"
            [validationMessages]="validationMessages"
            [placeholder]="'Nombre del rol'"
            [type]="'text'"
          ></app-input>

          <app-input
            [textLabel]="'Descripción'"
            [form]="roleForm"
            [controlName]="'descripcion'"
            [placeholder]="'Descripción del rol'"
            [isTextArea]="true"
            [showRequiredMark]="false"
          ></app-input>

          <div class="modal-actions">
            <app-button
              [text]="'Cancelar'"
              [class]="['btn', 'btn-primary-secondary']"
              [type]="'button'"
              (clickEventButton)="cerrarForm()"
            ></app-button>
            <app-button
              [text]="saving() ? 'Guardando…' : 'Guardar'"
              [icon]="saving() ? 'bi bi-arrow-clockwise' : 'bi bi-check-lg'"
              [class]="['btn', 'btn-primary']"
              [type]="'submit'"
              [disabled]="saving()"
              (clickEventButton)="guardar()"
            ></app-button>
          </div>
        </form>
      </div>
    </div>
  </div>
}

<!-- Confirmación toggle estado -->
<app-confirm-modal
  [visible]="confirmVisible()"
  [title]="confirmTitle()"
  [message]="confirmMsg()"
  [confirmText]="confirmRole()?.estado === 'ACTIVO' ? 'Inactivar' : 'Activar'"
  [isDestructive]="confirmRole()?.estado === 'ACTIVO'"
  (confirm)="ejecutarToggle()"
  (cancel)="confirmVisible.set(false)"
></app-confirm-modal>
